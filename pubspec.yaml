name: farmtech_agridirect
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  maplibre_gl: ^0.26.1
  url_launcher: ^6.3.1
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  osm_search_and_pick: ^0.4.0
  firebase_core: ^4.9.0
  http: ^1.2.2
  shared_preferences: ^2.5.2
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.4.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo1.png"
