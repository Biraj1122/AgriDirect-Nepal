name: farmtech_agridirect
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications: ^22.0.0
  firebase_messaging: ^15.2.2
  cupertino_icons: ^1.0.8
  maplibre_gl: ^0.26.1
  url_launcher: ^6.3.1
  geolocator: ^14.0.2
  geocoding: ^3.0.0
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  osm_search_and_pick: ^0.4.0
  firebase_core: ^3.12.0
  http: ^1.2.2
  shared_preferences: ^2.5.2
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  intl: ^0.19.0

  # Image Upload Dependencies
  image_picker: ^1.2.2
  firebase_storage: ^12.4.1
  cloud_functions: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo1.png"
