name: farmtech_agridirect
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^3.12.0
  firebase_auth:
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.2.0
  cloud_functions: ^5.1.2
  flutter_local_notifications: ^22.0.1
  fl_chart: ^1.2.0
  google_sign_in: ^6.2.2
  flutter_facebook_auth:

  http: ^1.2.2
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  path: ^1.9.1

  geolocator: ^14.0.2
  geocoding: ^3.0.0
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  maplibre_gl:
  osm_search_and_pick: ^0.4.0

  cached_network_image: ^3.4.1
  provider: ^6.1.2
  aws_s3_upload:

  image_picker: ^1.2.2
  image: ^4.2.0
  google_generative_ai: ^0.4.4

  cloudinary_public:

  url_launcher: ^6.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

dependency_overrides:
  http: ^1.2.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo_full.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/logo_adaptive.png
